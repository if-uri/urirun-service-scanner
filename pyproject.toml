[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urirun-service-scanner"
version = "0.1.1"
description = "Standalone urirun phone document scanner service on port 8196"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "if-uri" }]
dependencies = ["urirun[host]>=0.4.88"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://connect.ifuri.com/services/scanner"
Repository = "https://github.com/if-uri/urirun-service-scanner"

[project.scripts]
urirun-service-scanner = "urirun_service_scanner.core:main"
urirun-scanner = "urirun_service_scanner.core:main"

[project.entry-points."urirun.services"]
scanner = "urirun_service_scanner.core:urirun_service"

[tool.setuptools.packages.find]
where = ["."]
include = ["urirun_service_scanner*"]

[tool.setuptools.package-data]
urirun_service_scanner = ["service.manifest.json"]

[tool.wellmanifest]
standard = "0.20.35"
revision = "cfaa0bf0ea6b0e7349fed0bb62b5ce15792d687d"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
